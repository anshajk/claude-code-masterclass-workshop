[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-masterclass-workshop"
version = "0.1.0"
description = "Google ADK exercises for the Claude Code masterclass"
requires-python = ">=3.10"
dependencies = [
  "google-adk==2.9.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["workshop_agent*"]
exclude = ["checkpoints*", "tests*"]
