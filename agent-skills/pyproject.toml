[project]
name = "agent-skills-demo"
version = "0.1.0"
description = "SQLite migration workshop for the Agent Skills masterclass"
authors = [{ name = "Ergosphere Labs" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
