name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review pull request with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            Review this pull request for correctness and maintainability. Include a concise overview of what changed and any helpful details for understanding the change. Add a Mermaid diagram only if it materially clarifies the change; do not force a diagram when one would not help.
          claude_args: |
            --model claude-haiku-4-5
            --max-turns 5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
